<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ACE – Poranny Skan Rynku</title>

  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <link rel="stylesheet" href="../../assets/css/theme.css?v=4">
  <link rel="stylesheet" href="../../assets/css/scan.css?v=2">
</head>

<body>
<div class="wrap">
  <header>
    <div class="brand">
      <img src="../../assets/img/logo.png" alt="#Fundusze Promocji" class="logo">
      <div>
        <h1>ACE – Poranny Skan Rynku</h1>
        <p class="sub">Szybkie newsy ze świata i Polski</p>
      </div>
    </div>

    <div class="headerActions">
      <a class="btn" id="btnHome" href="../../index.html" title="Wróć do panelu">← Panel główny</a>
      <div class="pill" id="asof">Aktualizacja: —</div>
      <div class="pill" id="next">Kolejne wydanie: —</div>
    </div>
  </header>

  <div class="topbar">
    <div>
      <button class="btn active" id="btnPL" type="button">PL</button>
      <button class="btn" id="btnEN" type="button">EN</button>
    </div>
    <div class="pill">Źródło: <strong>ACE Group</strong></div>
  </div>

  <section class="panel" id="main"></section>
  <div id="err" class="error" hidden></div>

  <section class="panel archive" id="archive"></section>

  <div class="footer">
    To nie jest porada inwestycyjna. Treści są poglądem Autora <code>Agri Commodity Experts Sp. z o.o.</code>
  </div>
</div>

<!-- Lightbox -->
<div class="lb" id="lb">
  <div class="lbInner">
    <button class="lbClose" id="lbClose" type="button" title="Zamknij">✕</button>
    <img class="lbImg" id="lbImg" alt="Podgląd" />
  </div>
</div>

<script>
  const DATA_URL = "scan.json?ts=" + Date.now();

  let LANG = "pl";
  let ITEMS = [];
  let ACTIVE_ID = null;

  function setLang(lang){
    LANG = lang;
    document.getElementById("btnPL").classList.toggle("active", lang==="pl");
    document.getElementById("btnEN").classList.toggle("active", lang==="en");
    updateHeaderFromToday();
    render();
  }

  function fmtDate(iso){
    if(!iso) return "—";
    const p = iso.split("-");
    if(p.length!==3) return iso;
    return (LANG==="pl") ? `${p[2]}.${p[1]}.${p[0]}` : `${p[0]}-${p[1]}-${p[2]}`;
  }

  function esc(s){
    return (s||"").toString()
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;");
  }

  function parseISODate(iso){
    const p = (iso||"").split("-");
    if(p.length!==3) return null;
    const y = Number(p[0]), m = Number(p[1])-1, d = Number(p[2]);
    const dt = new Date(y, m, d);
    return isNaN(dt.getTime()) ? null : dt;
  }

  // next business day (Mon–Fri); without holidays
  function nextBusinessDay(dateObj){
    const d = new Date(dateObj.getFullYear(), dateObj.getMonth(), dateObj.getDate());
    do { d.setDate(d.getDate() + 1); } while (d.getDay() === 0 || d.getDay() === 6);
    return d;
  }

  function fmtDatePretty(dt){
    if(!(dt instanceof Date)) return "—";
    if(LANG==="pl"){
      return dt.toLocaleDateString("pl-PL", { day:"2-digit", month:"2-digit", year:"numeric" });
    }
    return dt.toLocaleDateString("en-GB", { day:"2-digit", month:"short", year:"numeric" });
  }

  function isNonEmptyText(x){
    return (x||"").toString().trim().length > 0;
  }

  function openLightbox(src){
    const lb = document.getElementById("lb");
    const img = document.getElementById("lbImg");
    img.src = src;
    lb.classList.add("open");
  }
  function closeLightbox(){
    const lb = document.getElementById("lb");
    const img = document.getElementById("lbImg");
    img.src = "";
    lb.classList.remove("open");
  }
  document.getElementById("lbClose").onclick = closeLightbox;
  document.getElementById("lb").addEventListener("click", (e)=>{
    if(e.target.id === "lb" || e.target.id === "lbImg") closeLightbox();
  });

  function renderMediaColumn(mediaArr){
    if(!mediaArr || !mediaArr.length) return "";
    const cards = mediaArr.map(raw => {
      const src = normalizeMediaSrc(raw);
      if(!src) return "";
      return `
        <div class="imgCard">
          <img src="${esc(src)}" alt="media" data-zoom="${esc(src)}"
               onerror="this.closest('.imgCard')?.remove()" />
        </div>
      `;
    }).join("");
    return `<div class="mediaCol">${cards}</div>`;
  }

  function splitIconTokens(iconValue){
    const raw = (iconValue || "").toString().trim();
    if(!raw) return [];

    // Ikony można oddzielać spacją, przecinkiem, średnikiem lub pionową kreską.
    const explicit = raw
      .split(/[|,;]+|\s+/u)
      .map(x => x.trim())
      .filter(Boolean);

    if(explicit.length > 1) return explicit.slice(0, 4);

    // Tekstowe skróty pozostają jednym znacznikiem.
    if(/[\p{L}\p{N}]/u.test(raw)) return [raw];

    // Poprawne dzielenie emoji, także z modyfikatorami i łącznikami ZWJ.
    if(typeof Intl !== "undefined" && Intl.Segmenter){
      const segmenter = new Intl.Segmenter(undefined, {granularity: "grapheme"});
      return Array.from(segmenter.segment(raw), x => x.segment)
        .filter(x => x.trim())
        .slice(0, 4);
    }

    return Array.from(raw).filter(x => x.trim()).slice(0, 4);
  }

  function renderIcons(iconValue){
    const icons = splitIconTokens(iconValue);
    if(!icons.length) return "";

    return `
      <span class="icons" aria-hidden="true">
        ${icons.map(icon => `<span class="icon">${esc(icon)}</span>`).join("")}
      </span>
    `;
  }

  function section(icon, title, text, mediaArr){
    const iconsHtml = renderIcons(icon);
    const textHtml = isNonEmptyText(text) ? `<p class="text">${esc(text)}</p>` : `<p class="text">—</p>`;
    const mediaHtml = renderMediaColumn(mediaArr);

    if(!mediaHtml){
      return `
        <div class="sec">
          <h2>${iconsHtml}<span class="sectionTitle">${esc(title)}</span></h2>
          ${textHtml}
        </div>
      `;
    }

    return `
      <div class="sec">
        <h2>${iconsHtml}<span class="sectionTitle">${esc(title)}</span></h2>
        <div class="flowWrap">
          ${mediaHtml}
          ${textHtml}
        </div>
      </div>
    `;
  }

  function normalizeMediaSrc(src){
    let s = (src ?? "").toString();

    s = s
      .replace(/[\u200B-\u200D\uFEFF]/g, "")
      .replace(/\u00A0/g, " ")
      .trim();

    s = s.replace(/([^:])\/{2,}/g, "$1/");

    if(!s) return "";

    if(!/^https?:\/\//i.test(s) && !s.startsWith("scan_media/")) {
      s = "scan_media/" + s;
    }
    return s;
  }

  function renderMain(item){
    const t = item[LANG] || null;

    const hasLang = t && (
      isNonEmptyText(t.title) ||
      isNonEmptyText(t.lead) ||
      isNonEmptyText(t.fx) ||
      isNonEmptyText(t.agri) ||
      (Array.isArray(t.blocks) && t.blocks.length)
    );

    if(!hasLang){
      document.getElementById("main").innerHTML = `<div class="text">Brak treści w tym języku.</div>`;
      return;
    }

    const dateLine = `${fmtDate(item.date)} | ${item.time || "—"}`;
    const title = (t.title || "").toString().trim() || (LANG==="pl" ? "ACE – Poranny Skan Rynku" : "ACE – Morning Market Scan");
    const lead = (t.lead || "").toString();

    let leadMedia = [];
    if (Array.isArray(t.lead_media) && t.lead_media.length) {
      leadMedia = t.lead_media
        .filter(m => m && m.type === "image" && isNonEmptyText(m.src))
        .map(m => normalizeMediaSrc(m.src))
        .filter(Boolean);
    }

    const leadHtml = isNonEmptyText(lead)
      ? (leadMedia.length
          ? `<div class="flowWrap leadRow">
               ${renderMediaColumn(leadMedia)}
               <p class="lead leadBlue">${esc(lead)}</p>
             </div>`
          : `<p class="lead leadBlue leadSpacing">${esc(lead)}</p>`
        )
      : "";

    const blocks = Array.isArray(t.blocks) ? t.blocks : [];
    let blocksHtml = "";

    for (let i = 0; i < blocks.length; i++){
      const b = blocks[i] || {};
      const bTitle = (b.title || "").toString().trim();
      const bText  = (b.text  || "").toString();

      if(!isNonEmptyText(bTitle) || !isNonEmptyText(bText)) continue;

      const tl = bTitle.toLowerCase();
      const introLike =
        tl === "tytuł" ||
        tl === "wprowadzenie" ||
        tl === "krótki wstęp do dnia:" ||
        tl === "krótki wstęp do dnia" ||
        tl === "na co dziś zwracamy uwagę ?" ||
        tl === "na co dziś zwracamy uwagę?" ||
        tl === "co dziś ważnego ?" ||
        tl === "co dziś ważnego";

      if(introLike) continue;
      if(lead && bText.trim() === lead.trim()) continue;
      if(title && bText.trim() === title.trim()) continue;

      let mediaArr = [];
      if(Array.isArray(b.media) && b.media.length){
        mediaArr = b.media
          .filter(m => m && m.type === "image" && isNonEmptyText(m.src))
          .map(m => normalizeMediaSrc(m.src))
          .filter(Boolean);
      }

      blocksHtml += section(b.icon || "", bTitle, bText, mediaArr);
    }

    if(!blocksHtml){
      const fx = (t.fx||"").toString();
      const agri = (t.agri||"").toString();
      if(isNonEmptyText(agri)) blocksHtml += section("🌾", (LANG==="pl"?"Zboża i oleiste":"Grains & Oilseeds"), agri, []);
      if(isNonEmptyText(fx)) blocksHtml += section("💵", (LANG==="pl"?"FX / Makro":"FX / Macro"), fx, []);
      if(!blocksHtml) blocksHtml = `<p class="text">—</p>`;
    }

    document.getElementById("main").innerHTML = `
      <div>
        <div class="reportBlock">
          <div class="reportHeader">
            <div class="reportHeaderRow">
              <div>
                <div class="reportTitle">${esc(title)}</div>
                <div class="date">${esc(dateLine)}</div>
              </div>
              <div class="pill">ID: <strong>${esc(item.id)}</strong></div>
            </div>
          </div>

          ${leadHtml}
          ${blocksHtml}
        </div>
      </div>
    `;

    document.getElementById("main").querySelectorAll("img[data-zoom]").forEach(img=>{
      img.addEventListener("click", ()=>openLightbox(img.dataset.zoom));
    });
  }

  function renderArchive(){
    const box = document.getElementById("archive");

    const t = (LANG==="pl")
      ? {h:"Archiwum", open:"Otwórz", empty:"Brak archiwum.", today:"DZIŚ"}
      : {h:"Archive", open:"Open", empty:"No archive yet.", today:"TODAY"};

    const pad2 = (n)=> String(n).padStart(2,"0");
    const now = new Date();
    const todayIso = `${now.getFullYear()}-${pad2(now.getMonth()+1)}-${pad2(now.getDate())}`;

    const today = ITEMS[0] || null;
    const isToday = !!(today && today.date && today.date === todayIso);

    const startIdx = isToday ? 1 : 0;
    const firstId = (ITEMS[0] || {}).id;

    const archItems = ITEMS
      .slice(startIdx)
      .filter(x => x && x.id !== firstId)
      .slice(0, 10);

    const todayTile = isToday ? `
      <div class="architem" data-id="${esc(today.id)}" data-today="1">
        <div style="display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap">
          <div style="font-weight:700">${esc(((today[LANG]||{})?.title) || (LANG==="pl"?"Poranny Skan":"Morning Scan"))}</div>
          <div class="pill todayPill">
            ${t.today}
          </div>
        </div>
        <div class="archmeta">
          <span class="archdate">${fmtDate(today.date)} | ${today.time || "—"}</span>
          <span>${t.open} →</span>
        </div>
      </div>
    ` : "";

    box.innerHTML = `
      <h3>${t.h}</h3>
      ${todayTile}
      ${archItems.length ? `
        <div class="archgrid archgridSpacing">
          ${archItems.map(it => {
            const tt = it[LANG] || {};
            return `
              <div class="architem" data-id="${esc(it.id)}">
                <div style="font-weight:700">${esc(tt.title || (LANG==="pl"?"Poranny Skan":"Morning Scan"))}</div>
                <div class="archmeta">
                  <span class="archdate">${fmtDate(it.date)} | ${it.time || "—"}</span>
                  <span>${t.open} →</span>
                </div>
              </div>
            `;
          }).join("")}
        </div>
      ` : `<p class="text">${t.empty}</p>`}
    `;

    box.querySelectorAll(".architem").forEach(el=>{
      el.addEventListener("click",()=>{
        ACTIVE_ID = el.dataset.id;
        render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
    });
  }

  function render(){
    const current = ITEMS.find(x => x.id === ACTIVE_ID) || ITEMS[0];
    if(!current) return;
    ACTIVE_ID = current.id;
    renderMain(current);
    renderArchive();
  }

  function updateHeaderFromToday(){
    const today = ITEMS[0];
    if(!today){
      document.getElementById("asof").textContent = (LANG==="pl") ? "Aktualizacja: —" : "Updated: —";
      document.getElementById("next").textContent = (LANG==="pl") ? "Kolejne wydanie: —" : "Next edition: —";
      return;
    }

    document.getElementById("asof").textContent =
      (LANG==="pl")
        ? `Aktualizacja: ${fmtDate(today.date)} | ${today.time || "—"}`
        : `Updated: ${today.date || "—"} | ${today.time || "—"}`;

    const dt = parseISODate(today.date);
    if(dt){
      const nxt = nextBusinessDay(dt);
      document.getElementById("next").textContent =
        (LANG==="pl") ? `Kolejne wydanie: ${fmtDatePretty(nxt)}` : `Next edition: ${fmtDatePretty(nxt)}`;
    } else {
      document.getElementById("next").textContent =
        (LANG==="pl") ? "Kolejne wydanie: —" : "Next edition: —";
    }
  }

  function updateLangButtons(){
    const today = ITEMS[0] || null;
    const btnEN = document.getElementById("btnEN");
    if(!today || !today.en){
      btnEN.classList.add("disabled");
      return;
    }
    const en = today.en;
    const ok = (
      isNonEmptyText(en.title) ||
      isNonEmptyText(en.lead) ||
      isNonEmptyText(en.fx) ||
      isNonEmptyText(en.agri) ||
      (Array.isArray(en.blocks) && en.blocks.length) ||
      (Array.isArray(en.lead_media) && en.lead_media.length)
    );
    btnEN.classList.toggle("disabled", !ok);
  }

  async function init(){
    try{
      const res = await fetch(DATA_URL, {cache:"no-store"});
      if(!res.ok) throw new Error("Nie mogę wczytać scan.json");
      const data = await res.json();
      ITEMS = Array.isArray(data.items) ? data.items : [];

      updateLangButtons();
      updateHeaderFromToday();
      render();
    } catch(e){
      const err = document.getElementById("err");
      err.hidden = false;
      err.textContent = "Błąd: " + (e && e.message ? e.message : e);
    }
  }

  document.getElementById("btnPL").onclick = ()=>setLang("pl");
  document.getElementById("btnEN").onclick = ()=>{
    if(document.getElementById("btnEN").classList.contains("disabled")) return;
    setLang("en");
  };

  init();
</script>
</body>
</html>
